name: Contratos y aplicación
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # check no regenera ni aprueba: detecta archivos olvidados en el cambio.
      - run: npm run docs:check
      - run: npm run test:docs
      - run: npm test
      - run: npm run build
